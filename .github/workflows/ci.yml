name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # `cargo test` links the PyO3 bindings against libpython.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install GUI system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # --locked fails the build if Cargo.lock is out of date, so CI tests the
      # dependency versions that are committed.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Debug build keeps integer-overflow checks on; release catches optimisation-only issues.
      - name: Test (debug)
        run: cargo test --workspace --locked

      - name: Test (release)
        run: cargo test --workspace --release --locked

  python:
    name: Python bindings (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest CPython the bindings support. PyO3 0.22 caps at 3.13,
        # which is why pyproject.toml sets requires-python = ">=3.9,<3.14".
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: Swatinem/rust-cache@v2

      - name: Build and install
        run: |
          python -m pip install -r python/requirements.txt
          python -m pip install ./python

      - name: Test
        run: python -m pytest python/tests -q
