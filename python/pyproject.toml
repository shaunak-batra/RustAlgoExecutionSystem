[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "algo-exec-py"
version = "0.1.0"
description = "Python bindings (PyO3) for the Rust execution-algorithm library"
# PyO3 0.22 supports CPython 3.13 at the newest, so cap the range here. Without
# the cap, pip on a newer interpreter starts the build and fails in the compiler
# instead of reporting an incompatible requirement.
requires-python = ">=3.9,<3.14"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "hypothesis>=6.0",
]

[tool.maturin]
# Mixed layout: the pure-Python package `algo_exec_py/` ships with the compiled
# extension installed inside it as `algo_exec_py._native`.
python-source = "."
module-name = "algo_exec_py._native"
manifest-path = "../crates/python-bindings/Cargo.toml"
features = ["extension-module"]
