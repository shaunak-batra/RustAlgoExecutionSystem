# Engine server settings, loaded by `cargo run -p engine -- --config config/default.toml`.
#
# Unknown keys are rejected, so a misspelled setting is an error rather than a
# silent default. Money amounts are in price units; the engine converts them to
# integer ticks (1 price unit = 100000 ticks).

[engine]
# How often due child orders are released and simulated quotes are refreshed.
tick_interval_ms = 50
# Capacity of the channel from the gRPC service to the engine task.
command_buffer = 1024
# How many fills a slow StreamFills client may fall behind before its stream ends with DATA_LOSS.
fill_buffer = 4096
# Finished parent orders kept for GetOrderStatus; older ones are forgotten.
retained_finished_orders = 10000

[api]
# The API has no authentication, so it listens on loopback only.
listen_addr = "127.0.0.1:50051"

[risk]
# Largest single parent order, in units.
max_order_qty = 100000
# Largest single parent order notional, priced at the worse of its limit price and the mid.
max_order_notional = 10000000.0
# Largest absolute position per symbol, counting unfilled working orders as if they filled.
max_position_qty = 500000
# Largest gross exposure across all symbols, including working orders.
max_gross_notional = 50000000.0
# Limit prices must be within this many basis points of the mid.
price_collar_bps = 500
# Trading halts (working orders cancelled, new orders rejected) once total P&L falls to -max_loss.
max_loss = 250000.0

# Simulated markets. A market maker quotes `levels` price levels on each side of
# `reference_price`, `level_spacing_bps` apart, with `qty_per_level` units at each,
# and replaces its quotes every tick. The reference price does not move: trading
# consumes depth, which the next refresh restores.

[[venue.symbols]]
symbol = "BTC-USD"
reference_price = 65000.0
levels = 20
qty_per_level = 5
level_spacing_bps = 1

[[venue.symbols]]
symbol = "ETH-USD"
reference_price = 3500.0
levels = 20
qty_per_level = 50
level_spacing_bps = 1

[[venue.symbols]]
symbol = "SIM-EQ"
reference_price = 100.0
levels = 10
qty_per_level = 5000
level_spacing_bps = 2
