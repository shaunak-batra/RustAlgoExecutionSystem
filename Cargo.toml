[workspace]
members = [
    "crates/orderbook",
    "crates/algo-core",
    "crates/engine",
    "crates/api",
    "crates/config",
    "crates/analytics",
    "crates/indicators",
    "crates/backtesting",
    "crates/python-bindings",
    "crates/trader-gui",
]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }

# gRPC and protobuf
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
# Bundled protoc so a fresh clone builds without a system protobuf install
protoc-bin-vendored = "3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Python bindings. `extension-module` is enabled only when building the wheel
# (see python/pyproject.toml) so `cargo test` links on every platform.
pyo3 = "0.22"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Testing and benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"

# GUI
eframe = "0.29"
egui = "0.29"

# Utilities
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.bench]
inherits = "release"
