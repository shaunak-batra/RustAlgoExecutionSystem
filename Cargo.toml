[workspace]
members = [
    "crates/algo-core",
    "crates/orderbook",
    "crates/engine",
    "crates/api",
    "crates/python-bindings",
    "crates/trader-gui",
    "crates/database",
    "crates/config",
    "crates/market-data",
    "crates/indicators",
    "crates/analytics",
    "crates/backtesting",
    "crates/strategies",
]
resolver = "2"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.41", features = ["full"] }

# gRPC and protobuf
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Python bindings
pyo3 = { version = "0.22", features = ["extension-module"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Testing and benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"

# GUI (optional)
eframe = "0.29"
egui = "0.29"

# Utilities
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.bench]
inherits = "release"
